name: Build Telegram X Custom

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23b

      - name: Setup local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "telegram.api_id=${{ secrets.API_ID }}" >> local.properties
          echo "telegram.api_hash=${{ secrets.API_HASH }}" >> local.properties
          echo "app.id=com.private.telegramx.mm" >> local.properties
          echo "app.name=Telegram X Custom" >> local.properties
          echo "app.experimental=true" >> local.properties
          echo "app.disable_signing=true" >> local.properties

      - name: Build arm64 Release APK
        run: |
          ./gradlew :app:assembleLatestArm64Release --stacktrace

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/latest/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-x-custom-arm64
          path: ${{steps.sign_app.outputs.signedReleaseFile}}
