name: Build Telegram X Custom

on:
  push:
    branches: [ master, main, custom-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 0

      - name: Ensure LFS objects are pulled
        run: |
          git lfs pull
          git submodule foreach git lfs pull

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23b

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm nasm make

      - name: Setup Gradle Properties
        run: |
          echo "android.ndk.suppressMinSdkVersionError=21" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Setup local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "telegram.api_id=${{ secrets.API_ID }}" >> local.properties
          echo "telegram.api_hash=${{ secrets.API_HASH }}" >> local.properties
          echo "app.id=com.private.telegramx.mm" >> local.properties
          echo "app.name=Telegram X Custom" >> local.properties
          echo "app.experimental=true" >> local.properties
          echo "app.disable_signing=true" >> local.properties

      - name: Patch rlottie for arm64-v8a stability
        run: |
          # Disable problematic NEON assembly in BuildRlottie.cmake
          sed -i 's/"${RLOTTIE_DIR}\/src\/vector\/vdrawhelper_neon.cpp"//g' app/jni/BuildRlottie.cmake
          sed -i '/if (${ANDROID_ABI} STREQUAL "armeabi-v7a")/,/endif()/c\target_compile_definitions(rlottie PRIVATE LOTTIE_NO_NEON)' app/jni/BuildRlottie.cmake
          
          # Wrap NEON calls in vdrawhelper.cpp
          sed -i 's/#if defined(__ARM_NEON__) || defined(__ARM64_NEON__)/#if (defined(__ARM_NEON__) || defined(__ARM64_NEON__)) \&\& !defined(LOTTIE_NO_NEON)/g' app/jni/third_party/rlottie/src/vector/vdrawhelper.cpp

      - name: Prepare Native Libraries
        env:
          TERM: xterm
        run: |
          # Define dummy styles to prevent tput errors
          export STYLE_END=""
          export STYLE_ERROR=""
          export STYLE_WARN=""
          export STYLE_INFO=""
          
          # Mock tput to avoid script failure
          sudo ln -sf /bin/true /usr/bin/tput || true
          
          # Set required environment variables for scripts
          export ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT
          export FLAVORS="latest"
          
          # Get actual NDK version from the installed directory
          NDK_ACTUAL_VERSION=$(basename $ANDROID_NDK_ROOT)
          
          # Update version.properties to match the installed NDK
          sed -i "s/version.ndk_primary=.*/version.ndk_primary=$NDK_ACTUAL_VERSION/" version.properties
          sed -i "s/version.ndk_legacy=.*/version.ndk_legacy=$NDK_ACTUAL_VERSION/" version.properties
          
          # Ensure NDK root is correctly pointed in the SDK directory as expected by scripts
          mkdir -p $ANDROID_SDK_ROOT/ndk
          if [ ! -d "$ANDROID_SDK_ROOT/ndk/$NDK_ACTUAL_VERSION" ]; then
            ln -s $ANDROID_NDK_ROOT $ANDROID_SDK_ROOT/ndk/$NDK_ACTUAL_VERSION
          fi
          
          source scripts/set-env.sh
          
          # Patch opus and others
          bash scripts/private/patch-opus-impl.sh
          bash scripts/private/patch-androidx-media-impl.sh
          
          # Build vpx and ffmpeg (only arm64-v8a)
          bash scripts/private/build-vpx-impl.sh
          bash scripts/private/build-ffmpeg-impl.sh

      - name: Build arm64 Release APK
        run: |
          ./gradlew :app:assembleLatestArm64Release --stacktrace

      - name: List Build Outputs
        run: |
          find app/build/outputs/apk -name "*.apk"

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/latest/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-x-custom-arm64
          path: ${{steps.sign_app.outputs.signedReleaseFile}}
